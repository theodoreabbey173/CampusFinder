<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-page); padding: 24px; color: var(--text-body); }
  .sec { margin-bottom: 22px; }
  .h { font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Button, Badge, Avatar, Card } = window.CampusFinderDesignSystem_84dfef;
    function Demo() {
      return (
        <div>
          <div className="sec">
            <div className="h">Buttons</div>
            <div className="row" style={{ marginBottom: 12 }}>
              <Button variant="primary">Get Started</Button>
              <Button variant="secondary" leadingIcon={<span>💬</span>}>Start Chat</Button>
              <Button variant="accent">Report Found</Button>
              <Button variant="danger">Log Out</Button>
            </div>
            <div className="row">
              <Button variant="outline">Cancel</Button>
              <Button variant="ghost">Skip</Button>
              <Button variant="primary" size="sm">Small</Button>
              <Button variant="primary" loading>Loading</Button>
              <Button variant="primary" disabled>Disabled</Button>
            </div>
          </div>
          <div className="sec">
            <div className="h">Badges</div>
            <div className="row">
              <Badge tone="lost" dot>Lost</Badge>
              <Badge tone="found" dot>Found</Badge>
              <Badge tone="info" solid>NEW</Badge>
              <Badge tone="success" dot>Resolved</Badge>
              <Badge tone="warning">Pending</Badge>
              <Badge tone="danger" dot>Reported</Badge>
              <Badge tone="neutral">Archived</Badge>
            </div>
          </div>
          <div className="sec" style={{ marginBottom: 0 }}>
            <div className="h">Avatars &amp; Card</div>
            <div className="row">
              <Avatar name="Sarah Johnson" />
              <Avatar name="Kwame Mensah" />
              <Avatar name="Theodore Abbey" />
              <Card accent="found" style={{ flex: 1, minWidth: 220 }}>
                <strong style={{ color: 'var(--text-strong)' }}>Blue Backpack</strong>
                <div style={{ fontSize: 13, color: 'var(--text-muted)', marginTop: 4 }}>📍 Library, 3rd Floor</div>
              </Card>
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
