<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-page); padding: 24px; }
  #root { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Input, SearchBar } = window.CampusFinderDesignSystem_84dfef;
    function Demo() {
      const [q, setQ] = React.useState('Backpack');
      return (
        <>
          <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
            <SearchBar value={q} onChange={e=>setQ(e.target.value)} onClear={()=>setQ('')} placeholder="Search by name, location…" />
            <Input label="Item Name" required placeholder="e.g. Blue Backpack" defaultValue="Blue Backpack" />
            <Input label="Location" leadingIcon={<span>📍</span>} placeholder="Where was it found?" />
          </div>
          <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
            <Input label="Description" multiline placeholder="Color, brand, distinguishing features…" />
            <Input label="Password" type="password" defaultValue="123" error="Use at least 8 characters" />
          </div>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
