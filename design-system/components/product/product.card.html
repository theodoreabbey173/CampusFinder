<!-- @dsCard group="Components" viewport="700x520" name="Product — Item, Stats, Chat, Empty" subtitle="Composed CampusFinder building blocks" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-page); padding: 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .chat { background: var(--surface-card); border:1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 14px; display:flex; flex-direction:column; gap:10px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { ItemCard, StatBanner, ChatBubble, EmptyState } = window.CampusFinderDesignSystem_84dfef;
    function Demo() {
      return (
        <div className="grid">
          <div className="stack">
            <StatBanner total={24} lost={9} found={15} />
            <ItemCard item={{ name:'Blue Backpack', type:'Found', location:'Library, 3rd Floor', time:'2 hours ago', reporterName:'Sarah J.', isNew:true, description:'Blue Jansport, laptop sleeve' }} />
            <ItemCard item={{ name:'iPhone 14 Pro', type:'Lost', location:'Student Center', time:'5 hours ago', reporterName:'Kwame M.', description:'Gold, cracked corner' }} />
          </div>
          <div className="stack">
            <div className="chat">
              <ChatBubble mine text="Hi! Is the iPhone 14 Pro still available?" time="10:30 AM" />
              <ChatBubble text="Yes! Can you describe it to verify it's yours?" time="10:32 AM" />
            </div>
            <EmptyState icon="💬" title="No conversations yet" message="When someone messages you about your item, it'll appear here." actionLabel="Browse Items" />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
