<!-- @dsCard group="Mobile App" viewport="900x760" name="CampusFinder Mobile App" subtitle="Interactive lost & found flow — tap through sign-up, browse, details, chat" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CampusFinder — Mobile UI Kit</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans);
    background:
      radial-gradient(900px 500px at 80% -10%, rgba(20,184,166,0.10), transparent 60%),
      radial-gradient(900px 500px at 10% 110%, rgba(30,64,175,0.10), transparent 60%),
      var(--neutral-100);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px;
  }
  .stage { display: flex; align-items: center; gap: 48px; }
  .copy { max-width: 320px; }
  .copy .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .copy .brand img { width: 48px; height: 48px; object-fit: contain; }
  .copy h1 { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1.1; letter-spacing: -0.02em; color: var(--text-strong); margin: 0 0 14px; }
  .copy p { font-size: 15px; line-height: 1.6; color: var(--text-muted); margin: 0 0 22px; }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg button { font-family: var(--font-display); font-weight: 700; font-size: 13px; padding: 8px 14px; border-radius: var(--radius-pill); border: 1.5px solid var(--border-default); background: var(--surface-card); color: var(--text-body); cursor: pointer; }
  .seg button.on { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }
  @media (max-width: 760px) { .copy { display: none; } }
</style>
</head>
<body>
  <div class="stage">
    <div class="copy">
      <div class="brand">
        <img src="../../assets/logo-mark.png" alt="" />
        <span style="font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:-0.02em">
          <span style="color:var(--blue-600)">Campus</span><span style="color:var(--teal-500)">Finder</span>
        </span>
      </div>
      <h1>Reunite lost items with their owners.</h1>
      <p>The redesigned CampusFinder app for University of Ghana students. Browse, report, and chat securely — all in one place. Jump to any screen:</p>
      <div class="seg" id="seg">
        <button data-s="auth">Sign Up</button>
        <button data-s="welcome">Welcome</button>
        <button data-s="list" class="on">Browse</button>
        <button data-s="details">Details</button>
        <button data-s="report">Report</button>
        <button data-s="chat">Chat</button>
        <button data-s="inbox">Inbox</button>
      </div>
    </div>
    <div id="cf-root"></div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel" src="frame.jsx"></script>
  <script type="text/babel" src="screens-auth.jsx"></script>
  <script type="text/babel" src="screens-browse.jsx"></script>
  <script type="text/babel" src="screens-chat.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
  <script type="text/babel">
    // Segmented jump control re-renders the phone at a chosen screen.
    const seg = document.getElementById('seg');
    let cur = ReactDOM.createRoot(document.getElementById('cf-root'));
    function mount(s) { cur.render(<window.CampusFinderApp start={s} />); }
    seg.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      [...seg.children].forEach((c) => c.classList.remove('on'));
      b.classList.add('on');
      mount(b.dataset.s);
    });
    setTimeout(() => mount('list'), 0);
  </script>
</body>
</html>
