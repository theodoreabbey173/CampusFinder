<!-- @dsCard group="Colors" viewport="700x150" name="Blue Scale" subtitle="Deep Blue brand ramp, 50–900" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-mono); background: var(--surface-card); padding: 22px; }
  .ramp { display: flex; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  .stop { flex: 1; height: 96px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; font-size: 10px; letter-spacing: .03em; }
</style>
</head>
<body>
  <div class="ramp">
    <div class="stop" style="background:var(--blue-50);color:var(--blue-700)">50</div>
    <div class="stop" style="background:var(--blue-100);color:var(--blue-700)">100</div>
    <div class="stop" style="background:var(--blue-200);color:var(--blue-800)">200</div>
    <div class="stop" style="background:var(--blue-300);color:var(--blue-900)">300</div>
    <div class="stop" style="background:var(--blue-400);color:#fff">400</div>
    <div class="stop" style="background:var(--blue-500);color:#fff">500</div>
    <div class="stop" style="background:var(--blue-600);color:#fff">600</div>
    <div class="stop" style="background:var(--blue-700);color:#fff">700</div>
    <div class="stop" style="background:var(--blue-800);color:#fff">800</div>
    <div class="stop" style="background:var(--blue-900);color:#fff">900</div>
  </div>
</body>
</html>
