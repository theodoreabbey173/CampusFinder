<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="Cool slate scale for text, surfaces, borders" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-mono); background: var(--surface-card); padding: 22px; }
  .ramp { display: flex; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--border-subtle); }
  .stop { flex: 1; height: 96px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; font-size: 10px; }
</style>
</head>
<body>
  <div class="ramp">
    <div class="stop" style="background:var(--neutral-0);color:var(--neutral-500)">0</div>
    <div class="stop" style="background:var(--neutral-50);color:var(--neutral-500)">50</div>
    <div class="stop" style="background:var(--neutral-100);color:var(--neutral-600)">100</div>
    <div class="stop" style="background:var(--neutral-200);color:var(--neutral-700)">200</div>
    <div class="stop" style="background:var(--neutral-300);color:var(--neutral-800)">300</div>
    <div class="stop" style="background:var(--neutral-400);color:#fff">400</div>
    <div class="stop" style="background:var(--neutral-500);color:#fff">500</div>
    <div class="stop" style="background:var(--neutral-600);color:#fff">600</div>
    <div class="stop" style="background:var(--neutral-700);color:#fff">700</div>
    <div class="stop" style="background:var(--neutral-800);color:#fff">800</div>
    <div class="stop" style="background:var(--neutral-900);color:#fff">900</div>
    <div class="stop" style="background:var(--ink);color:#fff">ink</div>
  </div>
</body>
</html>
