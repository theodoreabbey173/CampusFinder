<!-- @dsCard group="Brand" viewport="700x230" name="Logo Lockups" subtitle="Horizontal lockup + icon mark" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-card); padding: 24px; display: flex; gap: 22px; align-items: stretch; }
  .panel { border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; padding: 22px; }
  .panel.wide { flex: 2; background: var(--neutral-50); }
  .panel.mark { flex: 1; }
  .panel img { max-width: 100%; max-height: 120px; }
  .cap { position: absolute; }
</style>
</head>
<body>
  <div class="panel wide"><img src="../assets/logo-horizontal.png" alt="CampusFinder horizontal logo" /></div>
  <div class="panel mark"><img src="../assets/logo-mark.png" alt="CampusFinder icon mark" /></div>
</body>
</html>
