<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing Scale" subtitle="4px base grid" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-mono); background: var(--surface-card); padding: 22px; }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .col { text-align: center; }
  .bar { background: var(--gradient-brand); border-radius: 4px; width: 100%; }
  .lbl { font-size: 10px; color: var(--text-muted); margin-top: 6px; }
  .px { font-size: 10px; color: var(--text-strong); font-weight: 700; }
</style>
</head>
<body>
  <div class="row">
    <div class="col" style="width:36px"><div class="bar" style="height:4px"></div><div class="px">4</div><div class="lbl">1</div></div>
    <div class="col" style="width:36px"><div class="bar" style="height:8px"></div><div class="px">8</div><div class="lbl">2</div></div>
    <div class="col" style="width:36px"><div class="bar" style="height:12px"></div><div class="px">12</div><div class="lbl">3</div></div>
    <div class="col" style="width:36px"><div class="bar" style="height:16px"></div><div class="px">16</div><div class="lbl">4</div></div>
    <div class="col" style="width:36px"><div class="bar" style="height:20px"></div><div class="px">20</div><div class="lbl">5</div></div>
    <div class="col" style="width:36px"><div class="bar" style="height:24px"></div><div class="px">24</div><div class="lbl">6</div></div>
    <div class="col" style="width:36px"><div class="bar" style="height:32px"></div><div class="px">32</div><div class="lbl">8</div></div>
    <div class="col" style="width:36px"><div class="bar" style="height:40px"></div><div class="px">40</div><div class="lbl">10</div></div>
    <div class="col" style="width:36px"><div class="bar" style="height:48px"></div><div class="px">48</div><div class="lbl">12</div></div>
    <div class="col" style="width:36px"><div class="bar" style="height:64px"></div><div class="px">64</div><div class="lbl">16</div></div>
  </div>
</body>
</html>
