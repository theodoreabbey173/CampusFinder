<!-- @dsCard group="Colors" viewport="700x180" name="Status & Functional" subtitle="Lost, Found, success, warning, danger" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-card); padding: 22px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .tok { border-radius: var(--radius-md); padding: 12px; border: 1px solid var(--border-subtle); }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: var(--radius-pill); font-size: 12px; font-weight: 700; }
  .dot { width: 8px; height: 8px; border-radius: 999px; }
  .name { margin-top: 10px; font-size: 12px; font-weight: 700; color: var(--text-strong); }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin-top: 2px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="tok"><span class="pill" style="background:var(--status-lost-bg);color:var(--status-lost-fg)"><span class="dot" style="background:var(--status-lost-solid)"></span>Lost</span><div class="name">Lost</div><div class="hex">orange-600 / 50</div></div>
    <div class="tok"><span class="pill" style="background:var(--status-found-bg);color:var(--status-found-fg)"><span class="dot" style="background:var(--status-found-solid)"></span>Found</span><div class="name">Found</div><div class="hex">teal-700 / 50</div></div>
    <div class="tok"><span class="pill" style="background:var(--color-success-bg);color:var(--color-success)"><span class="dot" style="background:var(--color-success)"></span>Done</span><div class="name">Success</div><div class="hex">#16A34A</div></div>
    <div class="tok"><span class="pill" style="background:var(--color-warning-bg);color:var(--amber-600)"><span class="dot" style="background:var(--color-warning)"></span>Caution</span><div class="name">Warning</div><div class="hex">#F5A524</div></div>
    <div class="tok"><span class="pill" style="background:var(--color-danger-bg);color:var(--color-danger)"><span class="dot" style="background:var(--color-danger)"></span>Error</span><div class="name">Danger</div><div class="hex">#E5484D</div></div>
  </div>
</body>
</html>
