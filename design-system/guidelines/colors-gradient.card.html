<!-- @dsCard group="Colors" viewport="700x170" name="Brand Gradient" subtitle="Blue → Teal — drawn from the logo pin" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-card); padding: 22px; display: flex; gap: 16px; }
  .g { flex: 1; height: 110px; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); display: flex; align-items: flex-end; padding: 12px 14px; }
  .lbl { font-size: 12px; font-weight: 700; color: #fff; font-family: var(--font-mono); }
</style>
</head>
<body>
  <div class="g" style="background:var(--gradient-brand)"><span class="lbl">--gradient-brand</span></div>
  <div class="g" style="background:var(--gradient-brand-soft)"><span class="lbl">--gradient-brand-soft</span></div>
</body>
</html>
