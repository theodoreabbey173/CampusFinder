<!-- @dsCard group="Colors" viewport="700x190" name="Brand Colors" subtitle="Deep Blue primary, Teal secondary, Orange accent" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-card); padding: 22px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  .chip { height: 86px; }
  .meta { padding: 10px 12px; }
  .name { font-weight: 700; font-size: 14px; color: var(--text-strong); }
  .hex { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); margin-top: 2px; letter-spacing: .02em; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--blue-600)"></div><div class="meta"><div class="name">Deep Blue</div><div class="hex">#1E40AF · primary</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--indigo-600)"></div><div class="meta"><div class="name">Indigo</div><div class="hex">#1E5080 · support</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--teal-500)"></div><div class="meta"><div class="name">Teal</div><div class="hex">#14B8A6 · secondary</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--orange-400)"></div><div class="meta"><div class="name">Orange</div><div class="hex">#FA8565 · accent</div></div></div>
  </div>
</body>
</html>
