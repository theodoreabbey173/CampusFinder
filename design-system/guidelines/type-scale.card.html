<!-- @dsCard group="Type" viewport="700x260" name="Type Scale" subtitle="xs 12 → 3xl 36" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-display); background: var(--surface-card); padding: 20px 26px; color: var(--text-heading); }
  .r { display: flex; align-items: baseline; gap: 16px; padding: 5px 0; border-bottom: 1px solid var(--neutral-100); }
  .r:last-child { border: 0; }
  .t { font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); width: 130px; text-align: right; flex-shrink: 0; }
</style>
</head>
<body>
  <div class="r"><span class="t" style="font-size:36px">Find what's lost</span><span class="lbl">3xl · 36</span></div>
  <div class="r"><span class="t" style="font-size:30px">Find what's lost</span><span class="lbl">2xl · 30</span></div>
  <div class="r"><span class="t" style="font-size:24px">Find what's lost</span><span class="lbl">xl · 24</span></div>
  <div class="r"><span class="t" style="font-size:20px">Find what's lost</span><span class="lbl">lg · 20</span></div>
  <div class="r"><span class="t" style="font-size:17px;font-family:var(--font-sans)">Find what's lost</span><span class="lbl">md · 17</span></div>
  <div class="r"><span class="t" style="font-size:15px;font-weight:500;font-family:var(--font-sans)">Find what's lost on campus</span><span class="lbl">sm · 14</span></div>
  <div class="r"><span class="t" style="font-size:12px;font-weight:500;font-family:var(--font-sans);color:var(--text-muted)">Find what's lost on campus</span><span class="lbl">xs · 12</span></div>
</body>
</html>
