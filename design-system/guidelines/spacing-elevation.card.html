<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation" subtitle="Shadow scale + branded glows" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-mono); background: var(--surface-page); padding: 26px 22px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .col { text-align: center; }
  .box { width: 84px; height: 60px; background: var(--surface-card); border-radius: var(--radius-md); }
  .lbl { font-size: 10px; color: var(--text-muted); margin-top: 12px; }
</style>
</head>
<body>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="lbl">xs</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="lbl">sm</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="lbl">md</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="lbl">lg</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-xl)"></div><div class="lbl">xl</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-primary);background:var(--blue-600)"></div><div class="lbl">primary</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-accent);background:var(--orange-400)"></div><div class="lbl">accent</div></div>
</body>
</html>
